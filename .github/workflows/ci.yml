name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify output
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/styles/base.css
          test -f public/scripts/main.js
          test -f public/assets/favicon.svg
          echo "Build output verified ✓"

      - name: Check internal links
        run: node scripts/check-links.js

      - name: Check sitemap vs seeded pages
        run: node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('content.json', 'utf8'));
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const seeded = config.pages.filter(p => p.seeded);
          const missing = seeded.filter(p => {
            const url = p.type === 'core'
              ? 'https://' + 'umbrella.lgbt/' + p.slug
              : 'https://' + 'umbrella.lgbt/' + p.type + '/' + p.slug;
            return !sitemap.includes(url);
          });
          if (missing.length > 0) {
            console.error('Seeded pages missing from sitemap:', missing.map(p => p.type + '/' + p.slug));
            process.exit(1);
          }
          console.log('Sitemap contains all ' + seeded.length + ' seeded pages ✓');
        "
