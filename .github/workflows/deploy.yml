name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only attempts a deploy once you've created the repo variable
    # DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables)
    # AND configured the VPS_* secrets + the server itself (docs/m7-deploy.md).
    if: github.repository_owner == 'nekwasar' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.REPO_DIR || '/opt/umbrella.lgbt' }}
            ./infra/scripts/deploy.sh
