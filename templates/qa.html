{{#seeded}}
<article class="max-w-read mx-auto prose-q">
  <div class="flex items-center gap-2 mb-7">
    <span class="inline-flex items-center rounded-full bg-pinksoft/15 px-3 py-1 text-[0.7rem] font-bold uppercase tracking-[0.08em] text-pink border border-pinksoft/25">{{topic}}</span>
  </div>
  <h1 class="type-h1 mb-6 pb-7 border-b border-line">{{title}}</h1>
  <div class="mt-9">
    {{content}}
  </div>
  {{#relatedQA}}
  <section class="mt-16 pt-9 border-t border-line">
    <h2 class="text-xs font-bold uppercase tracking-[0.08em] text-faint mb-6">More Questions Like This</h2>
    <ul class="grid sm:grid-cols-2 gap-3">
      {{relatedQA}}
    </ul>
  </section>
  {{/relatedQA}}
  {{crossLinks}}
</article>
{{/seeded}}
{{^seeded}}
<article class="max-w-read mx-auto">
  <div class="flex items-center gap-2 mb-7">
    <span class="inline-flex items-center rounded-full bg-pinksoft/15 px-3 py-1 text-[0.7rem] font-bold uppercase tracking-[0.08em] text-pink border border-pinksoft/25">{{topic}}</span>
  </div>
  <h1 class="type-h1 mb-8 pb-7 border-b border-line">{{title}}</h1>
  <div class="rounded-card border border-dashed border-linetrong bg-soft p-10 text-center mt-6">
    <p class="text-muted mb-4">Answers coming soon &mdash; join the waitlist to know when Umbrella.lgbt launches.</p>
    <a href="/waitlist" class="btn-retro">Coming {{launchYear}}</a>
  </div>
</article>
{{/seeded}}
