{{#seeded}}
<article class="max-w-read mx-auto prose-q">
  <h1 class="type-h1 mb-7 pb-7 border-b border-line">{{title}}</h1>
  <div class="mt-9">
    {{content}}
  </div>
  {{#otherResources}}
  <section class="mt-16 pt-9 border-t border-line">
    <h2 class="text-xs font-bold uppercase tracking-[0.08em] text-faint mb-6">Other Countries</h2>
    <ul class="grid sm:grid-cols-2 gap-3">
      {{otherResources}}
    </ul>
  </section>
  {{/otherResources}}
</article>
{{/seeded}}
{{^seeded}}
<article class="max-w-read mx-auto">
  <h1 class="type-h1 mb-8 pb-7 border-b border-line">{{title}}</h1>
  <div class="rounded-card border border-dashed border-linetrong bg-soft p-10 text-center mt-6">
    <p class="text-muted mb-4">Directory coming soon &mdash; join the waitlist to know when Umbrella.lgbt launches.</p>
    <a href="/waitlist" class="btn-retro">Coming {{launchYear}}</a>
  </div>
</article>
{{/seeded}}
