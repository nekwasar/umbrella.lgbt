name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify output
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/styles/base.css
          test -f public/scripts/main.js
          test -f public/assets/favicon.svg
          echo "Build output verified ✓"

      - name: Check internal links
        run: node scripts/check-links.js

      - name: Check sitemap vs seeded pages
        run: node scripts/check-sitemap.js
